<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPDE &mdash; Competitive Pipeline Decision Engine</title>
<style>
:root{
  --black:#0D0D0D; --black-2:#1C1C1C; --black-3:#2B2B2B;
  --accent:#3B6D11; --accent-dk:#2C5209; --accent-lt:#C5DCA8; --accent-tint:#EAF3DE;
  --canvas:#F5F5F5; --surface:#FFFFFF; --line:#E0E0E0; --line-2:#EEEEEE;
  --ink:#333333; --ink-2:#555555; --ink-3:#888888;
  --warn:#8A6A17; --warn-bg:#FBF4E2; --bad:#8C2F27; --good:#3B6D11;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);
  font-family:"Aptos","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.app{display:flex;min-height:100vh}
.side{width:214px;flex:0 0 214px;background:var(--black);color:#BFBFBF;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 15px;border-bottom:1px solid #2B2B2B}
.brand h1{margin:0;font-size:15px;letter-spacing:.22em;color:#fff;font-weight:600}
.brand span{display:block;margin-top:3px;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent-lt)}
.nav{padding:10px 0;flex:1;overflow:auto}
.nav-lbl{padding:14px 18px 5px;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:#6E6E6E}
.nav a{display:block;padding:7px 18px;color:#BFBFBF;text-decoration:none;
  font-size:12.5px;border-left:2px solid transparent;cursor:pointer}
.nav a:hover{background:#1C1C1C;color:#fff}
.nav a.on{background:var(--black-3);color:#fff;border-left-color:var(--accent-lt)}
.side-ft{padding:13px 18px;border-top:1px solid #2B2B2B;font-size:10.5px;color:#6E6E6E}
.main{flex:1;min-width:0}
.top{background:var(--surface);border-bottom:1px solid var(--line);
  padding:0 22px;display:flex;align-items:center;gap:16px;height:52px;
  position:sticky;top:0;z-index:6}
.top h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.tools{margin-left:auto;display:flex;gap:7px;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:var(--r);
  padding:4px 10px;font-size:12px;color:var(--ink-2);cursor:pointer}
.chip.on{background:var(--black);color:#fff;border-color:var(--black)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);
  border-radius:var(--r);padding:4px 7px;background:#fff;color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--accent-lt);outline-offset:-1px}
.body{padding:18px 22px 44px}
.view{display:none}.view.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.kpi .s{font-size:11px;color:var(--ink-2);margin-top:2px}
.kpi.hl{border-top:2px solid var(--accent)}
.kpi .up{color:var(--good)}.kpi .dn{color:var(--bad)}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:1fr 1fr}
.g23{grid-template-columns:1.3fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:1100px){.g2,.g23,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:11px;overflow:hidden}
.card>h3{margin:0;padding:10px 14px;font-size:12px;font-weight:600;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h3 small{margin-left:auto;font-weight:400;color:var(--ink-3);font-size:10.5px}
.pad{padding:13px 14px}
.sum{list-style:none;margin:0;padding:3px 0}
.sum li{display:flex;align-items:baseline;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line-2)}
.sum li:last-child{border-bottom:0}
.sum a{color:var(--accent-dk);text-decoration:none;border-bottom:1px solid var(--accent-lt);
  font-size:12.5px;cursor:pointer}
.sum a:hover{color:var(--black);border-bottom-color:var(--accent)}
.sum .r{margin-left:auto;font-weight:600;font-size:13px}
.sum .r em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:11px;margin-left:6px}
.tw{overflow:auto}
/* Pursuits-only: a bounded, independently-scrolling table region so the
   KPI cards and filter bar above it stay visible while scrolling rows.
   Not applied to .tw generally -- Staffing and B&P's tables are shorter
   and a fixed height would just clip them awkwardly. */
.tw.pursuits-scroll{max-height:62vh;overflow-y:auto}
.tw.pursuits-scroll thead th{position:sticky;top:0;z-index:3}
/* Staffing month columns: 60 five-character headers ("26-01") need to be
   tight or the table runs far wider than the card. */
.staff-tbl th{font-size:9px;padding:6px 5px;white-space:nowrap}
.staff-tbl td{font-size:11px;padding:5px 5px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{position:sticky;top:0;background:#EDEDED;text-align:left;padding:7px 9px;font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;
  border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{background:#E3E3E3}
th.r,td.r{text-align:right}
td{padding:6px 9px;border-bottom:1px solid var(--line-2);white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#FAFAFA}
tbody tr.sel{background:var(--accent-tint)}
tr.sub td{background:#FAFAFA;color:var(--ink-2);font-style:italic}
tfoot td{padding:7px 9px;font-weight:600;border-top:2px solid var(--line);background:#F7F7F7}
.pill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.p-pre{background:#EDEDED;color:#555}
.p-bh{background:var(--warn-bg);color:var(--warn)}
.p-ptw{background:var(--accent-tint);color:var(--accent-dk)}
.p-won{background:var(--accent-tint);color:var(--accent-dk)}
.p-lost{background:#F7E9E7;color:var(--bad)}
.p-can{background:#EDEDED;color:#888}
.p-bid{background:var(--accent-tint);color:var(--accent-dk)}
.p-nobid{background:#EDEDED;color:#777}
.dep{color:var(--accent-dk);font-size:10.5px;font-weight:600}
.pb{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.pb .t{width:40px;height:5px;background:#E8E8E8;border-radius:3px;overflow:hidden}
.pb .f{height:100%;background:var(--accent)}
.pb .f.lo{background:#9A8A2E}.pb .f.vlo{background:var(--bad)}
svg{display:block;width:100%;overflow:visible;margin-left:2px}
.ax{stroke:#D6D6D6;stroke-width:1}
.axl{fill:var(--ink-3);font-size:9.5px;font-family:ui-monospace,monospace}
.gl{stroke:var(--line-2);stroke-width:1}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;padding:9px 14px 2px;font-size:10.5px;color:var(--ink-2)}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:11px;color:var(--ink-3);padding:8px 14px 11px;line-height:1.5}
.flag{border-left:3px solid var(--accent);background:var(--accent-tint);padding:9px 12px;
  font-size:11.5px;color:var(--accent-dk);border-radius:0 var(--r) var(--r) 0;margin-bottom:11px}
.inp{width:110px;text-align:right}
.heat{display:inline-block;width:100%;text-align:right;padding:2px 4px;border-radius:2px}
.qa{display:grid;grid-template-columns:1fr;gap:0}
.qa .q{padding:9px 14px;border-bottom:1px solid var(--line-2)}
.qa .q label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
.qa .q select{width:100%}
.btn{background:var(--black);color:#fff;border:0;border-radius:var(--r);
  padding:6px 13px;font:inherit;font-size:12px;cursor:pointer}
.btn:hover{background:var(--accent-dk)}
.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.gh:hover{background:#F0F0F0;color:var(--ink)}

.dmk{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:3px;
  font-size:10px;font-weight:600;max-width:190px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;vertical-align:-2px}
.dep-child{background:#EAF3DE;color:#2C5209;border:1px solid #C5DCA8}
.dep-parent{background:#0D0D0D;color:#C5DCA8}
tr.dr-child td:first-child{box-shadow:inset 3px 0 0 #C5DCA8}
tr.dr-parent td:first-child{box-shadow:inset 3px 0 0 #0D0D0D}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--line);background:#FAFAFA}
.filters label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.filters select,.filters input{font-size:12px}
.sc{display:flex;gap:14px;padding:10px 14px;flex-wrap:wrap}
.sc div{font-size:11px;color:var(--ink-3)}
.sc b{display:block;font-size:15px;color:var(--ink);font-family:ui-monospace,monospace}
.sc .chg{font-size:10.5px;font-weight:700}
.up2{color:#3B6D11}.dn2{color:#8C2F27}

.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;padding:14px}
.srcc{border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;background:#fff}
.srcc h4{margin:0 0 3px;font-size:12.5px;font-weight:600}
.srcc p{margin:0 0 9px;font-size:11px;color:var(--ink-3);line-height:1.45}
.srcc .st{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.st-live{color:var(--accent)}.st-plan{color:var(--warn)}.st-file{color:var(--ink-3)}
td.att{background:#FBECEA;color:#8C2F27;font-weight:600}
td.att::after{content:" !";font-weight:700}
.needs{background:#8C2F27;color:#fff;padding:1px 6px;border-radius:9px;
  font-size:10px;font-weight:700;display:inline-block}
.ok{color:var(--accent);font-weight:600}
.stepbar{display:flex;gap:0;padding:0;border-bottom:1px solid var(--line)}
.step{flex:1;padding:9px 12px;font-size:11px;border-right:1px solid var(--line);
  color:var(--ink-3)}
.step:last-child{border-right:0}
.step b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:2px}
.step.on{background:var(--accent-tint)}
.step.on b{color:var(--accent-dk)}

/* Explicit dimensions and flex:none. This element sits inside .fr, whose
   label rule is 180px wide -- a nested <label> must not inherit that. */
.tg{display:inline-block;position:relative;width:26px;height:14px;flex:0 0 26px;
  cursor:pointer;vertical-align:-2px}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg span{position:absolute;left:0;top:0;width:26px;height:14px;background:#C9C9C9;
  border-radius:7px;transition:background .12s}
.tg span::before{content:"";position:absolute;width:10px;height:10px;left:2px;top:2px;
  background:#fff;border-radius:50%;transition:transform .12s}
.tg input:checked + span{background:var(--accent)}
.tg input:checked + span::before{transform:translateX(12px)}
.tg input:focus-visible + span{outline:2px solid var(--accent-lt);outline-offset:1px}
tr.nobid td:not(:first-child){opacity:.42}
tr.nobid td b{text-decoration:line-through}

.pager{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--line);
  background:#FAFAFA;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.pager select{font-size:11.5px;padding:2px 5px}
.pgbtns{margin-left:auto;display:flex;align-items:center;gap:5px}
.pgbtns .btn{padding:3px 9px;font-size:11.5px}
.pgbtns .btn[disabled]{opacity:.4;cursor:default}
.pgnum{padding:0 8px;font-variant-numeric:tabular-nums}
.dtbar{display:flex;align-items:center;gap:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:11px}
.dtt b{font-size:14px}
.dtt span{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.dtn{margin-left:auto;display:flex;gap:5px}
.dtn .btn{padding:3px 10px}
.fgrid{padding:2px 0}
.fr{display:flex;align-items:baseline;gap:12px;padding:7px 14px;border-bottom:1px solid var(--line-2)}
.fr:last-child{border-bottom:0}
.fr > label{width:180px;flex:0 0 180px;font-size:11px;color:var(--ink-3)}
.fv{flex:1;font-size:12.5px;display:flex;align-items:center}
.pen{margin-left:auto;opacity:0;color:var(--ink-3);font-size:11px}
.fr:hover .pen{opacity:1}
.fr:hover{background:#FAFAFA}
.fr.edit input,.fr.edit select{width:100%;max-width:280px;font-size:12.5px;padding:4px 7px}
.fr.edit input[type=checkbox]{width:auto}
.fr.dirty{background:var(--accent-tint)}
.fr.dirty label{color:var(--accent-dk);font-weight:600}
.fr.derived .fv{color:var(--ink-2)}
.lockwhy{margin-left:auto;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:9px;padding:1px 7px;cursor:help}
.fnote{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px;line-height:1.4;
  flex-basis:100%}
.fnote.warn{color:#8C2F27;font-weight:600}
.fr.edit .fv{flex-wrap:wrap}
.adorn{position:relative;display:inline-flex;align-items:center;max-width:280px;width:100%}
.adorn input{padding-left:22px !important}
.adorn.pct input{padding-left:7px !important;padding-right:24px !important}
.adorn::before{content:attr(data-sym);position:absolute;left:9px;color:var(--ink-3);
  font-size:12px;pointer-events:none}
.adorn.pct::before{left:auto;right:9px}
.qhelp{margin-left:6px;width:15px;height:15px;line-height:14px;text-align:center;
  border:1px solid var(--line);border-radius:50%;font-size:10px;color:var(--ink-3);
  cursor:pointer;display:inline-block;background:#fff}
.qhelp:hover{border-color:var(--accent);color:var(--accent-dk)}
.helpbox{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150;
  display:flex;align-items:center;justify-content:center}
.helpbox .inner{background:#fff;border-radius:6px;max-width:620px;width:90%;
  max-height:80vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.helpbox h4{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.helpbox .body2{padding:14px 18px;font-size:12.5px;line-height:1.62;white-space:pre-wrap}
.helpbox .ft{padding:11px 18px;border-top:1px solid var(--line);text-align:right}
.qa.locked{opacity:.55}
.qa.locked select{pointer-events:none}
.editbar{display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--accent-tint);border-bottom:1px solid var(--accent-lt);
  font-size:12px;color:var(--accent-dk)}
.editbar span{margin-left:auto;display:flex;gap:7px}
.editbar .btn{padding:3px 12px;font-size:11.5px}

/* login */
#loginScreen{position:fixed;inset:0;background:var(--black);display:flex;
  align-items:center;justify-content:center;z-index:100}
.loginbox{background:var(--surface);border-radius:6px;padding:30px 32px;
  width:340px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.loginbox h1{margin:0;font-size:20px;letter-spacing:.24em;font-weight:600}
.loginbox>span{display:block;margin-top:3px;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:22px}
.loginbox label{display:block;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.loginbox input{width:100%;padding:8px 10px;font-size:13px;margin-bottom:14px}
.loginbox .btn{width:100%;padding:9px}
.loginbox .err{color:var(--bad);font-size:11.5px;margin-top:10px;min-height:16px}
.loginbox .hint{font-size:10.5px;color:var(--ink-3);margin-top:14px;line-height:1.5}
.side-ft span{display:block}
.presence{display:none}
.presence.show{display:block;background:#FBF4E2;border-left:3px solid var(--warn);
  color:#6B5320;padding:9px 13px;font-size:11.5px;border-radius:0 var(--r) var(--r) 0;
  margin-bottom:11px}
.presence b{color:#4A3813}
.dif{padding:2px 0;font-size:11.5px;white-space:normal}
.dif b{display:inline-block;min-width:120px;color:var(--ink-2);font-weight:600}
.dif .was{color:var(--ink-3);text-decoration:line-through}
.dif .arr{color:var(--ink-3);margin:0 6px}
.dif .now{color:var(--accent-dk);font-weight:600}
#toast{position:fixed;left:50%;bottom:-60px;transform:translateX(-50%);
  background:var(--black);color:#fff;padding:9px 18px;border-radius:4px;
  font-size:12.5px;z-index:200;opacity:0;transition:bottom .18s,opacity .18s;
  box-shadow:0 6px 20px rgba(0,0,0,.28);max-width:70vw}
#toast.show{bottom:22px;opacity:1}
#toast.bad{background:var(--bad)}
/* Persistent, unlike #toast -- the portfolio having changed under the
   user is not a transient confirmation, it stays until they act. */
#changeBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:250;
  background:var(--accent-dk);color:#fff;padding:9px 16px;font-size:12.5px;
  align-items:center;justify-content:center;gap:14px;text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
#changeBanner.show{display:flex}
#changeBanner button{background:transparent;border:1px solid rgba(255,255,255,.55);
  color:#fff;padding:3px 11px;border-radius:3px;font-size:11.5px;cursor:pointer}
#changeBanner button.x{border:none;padding:0 4px;font-size:16px;line-height:1}
.side-ft #signOut{margin-top:10px;padding:4px 12px;font-size:11.5px;
  background:transparent;color:#BFBFBF;border-color:#2B2B2B}
.side-ft #signOut:hover{background:#1C1C1C;color:#fff;border-color:#3B3B3B}
</style></head><body><div class="app">
<aside class="side">
 <div class="brand"><h1>CDA</h1><span>Pipeline Decision Engine</span></div>
 <nav class="nav" id="nav">
   <div class="nav-lbl">Portfolio</div>
   <a data-v="dash" class="on">Dashboard</a>
   <a data-v="pursuits">Pursuits</a>
   <a data-v="staffing">Staffing Capacity</a>
   <div class="nav-lbl">Projections</div>
   <a data-v="revenue">Revenue &amp; Profit</a>

 </nav>
 <div class="side-ft">Demo Business Unit<br><span id="pyLbl">Planning year 2026</span></div>

<div class="main">

   <h2 id="title">Portfolio Dashboard</h2>
   <div class="tools" id="tools"></div>
 </header>
 <div class="body">

 </div></div></div>

<script>
/* Data now comes from the API rather than an embedded constant.
   loadData() fills D before any view renders. The views are unchanged --
   only the source moved. */
let D = {pursuits: [], targets: [], staffing: {months: [], cats: [], demand: {}, total: []},
         planning_year: new Date().getFullYear()};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
/* Set innerHTML only if the target exists. A missing container is a bug
   worth logging, not worth throwing over -- one view failing should not
   take the whole page down with it. */
function setHTML(sel, html){
  const el = document.querySelector(sel);
  if(!el){ console.warn('missing container', sel); return false; }
  el.innerHTML = html; return true;
}
const money=v=>'$'+Math.round(v||0).toLocaleString('en-US');
const M=v=>{const a=Math.abs(v||0);
  if(a>=1e9)return '$'+(v/1e9).toFixed(2)+'B';
  if(a>=1e6)return '$'+(v/1e6).toFixed(1)+'M';
  if(a>=1e3)return '$'+(v/1e3).toFixed(0)+'K';return '$'+Math.round(v||0);};
const pctS=v=>v==null?'\u2014':(v*100).toFixed(1)+'%';

function barsGrouped(series,labels,colors,{h=190,fmt=M,pad=36,w=760}={}){
  const n=labels.length, gw=(w-pad-8)/n, bw=Math.min(24,(gw-16)/series.length);
  const max=Math.max(...series.flatMap(s=>s.v),1);
  const y=v=>h-15-(v/max)*(h-36);
  let g='';
  for(let i=0;i<=4;i++){const gy=h-15-(i/4)*(h-36);
    g+=`<line class="gl" x1="${pad}" x2="${w}" y1="${gy}" y2="${gy}"/><text class="axl" x="4" y="${gy+3}">${fmt(max*i/4)}</text>`;}
  labels.forEach((l,i)=>{const x0=pad+6+i*gw;
    series.forEach((s,j)=>{
      const bx=x0+(gw-bw*series.length-4*(series.length-1))/2+j*(bw+4), vy=y(s.v[i]);
      g+=`<rect x="${bx}" y="${vy}" width="${bw}" height="${Math.max(0,h-15-vy)}" fill="${colors[j]}" rx="1"><title>${s.name} ${l}: ${fmt(s.v[i])}</title></rect>`;});
    g+=`<text class="axl" x="${x0+gw/2}" y="${h-2}" text-anchor="middle">${l}</text>`;});
  g+=`<line class="ax" x1="${pad}" x2="${w}" y1="${h-15}" y2="${h-15}"/>`;
  return `<svg viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
/* Bars for every series but the first, an overlaid line+dots for the
   first -- series[0] is always the target/budget in every call site
   (revS, bpS, the investment pair), so "the line is the target" holds
   without needing a separate flag. Same grid/axis/color conventions as
   barsGrouped -- a bar-only chart loses the target line's context,
   this is that context added back, not a different visual language. */
function comboChart(series,labels,colors,{h=190,fmt=M,pad=36,w=760}={}){
  const lineS=series[0], barS=series.slice(1);
  const n=labels.length, gw=(w-pad-8)/n, bw=Math.min(24,(gw-16)/Math.max(1,barS.length));
  const max=Math.max(...series.flatMap(s=>s.v),1);
  const y=v=>h-15-(v/max)*(h-36);
  let g='';
  for(let i=0;i<=4;i++){const gy=h-15-(i/4)*(h-36);
    g+=`<line class="gl" x1="${pad}" x2="${w}" y1="${gy}" y2="${gy}"/><text class="axl" x="4" y="${gy+3}">${fmt(max*i/4)}</text>`;}
  const pts=[];
  labels.forEach((l,i)=>{const x0=pad+6+i*gw;
    barS.forEach((s,j)=>{
      const bx=x0+(gw-bw*barS.length-4*(barS.length-1))/2+j*(bw+4), vy=y(s.v[i]);
      g+=`<rect x="${bx}" y="${vy}" width="${bw}" height="${Math.max(0,h-15-vy)}" fill="${colors[j+1]}" rx="1"><title>${s.name} ${l}: ${fmt(s.v[i])}</title></rect>`;});
    g+=`<text class="axl" x="${x0+gw/2}" y="${h-2}" text-anchor="middle">${l}</text>`;
    pts.push([x0+gw/2,y(lineS.v[i])]);});
  g+=`<path d="${pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"
        fill="none" stroke="${colors[0]}" stroke-width="2"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"
    fill="${colors[0]}" stroke="#fff" stroke-width="1"><title>${lineS.name} ${labels[i]}: ${fmt(lineS.v[i])}</title></circle>`;});
  g+=`<line class="ax" x1="${pad}" x2="${w}" y1="${h-15}" y2="${h-15}"/>`;
  return `<svg viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
/* Own small palette, deliberately NOT the staffing view's CCOL -- CCOL's
   first entry is near-black and Pre-BH (this app's default phase) being
   the dominant slice in every dataset loaded so far turned that into a
   giant black wedge. Greens/ambers already used elsewhere for bar/combo
   charts (revenue/bp/investment), just never collected into their own

const PIE_COLORS=['#3B6D11','#8A6A17','#4E8A1B','#639F2C','#A6862F','#96C463','#C2A455','#7CB343'];
/* Whole-to-parts. Only ever called for the two cards where a single
   year's category breakdown is the shape of the data -- see PIE_CARDS.
   Fixed pixel size, not viewBox-only: the page's global svg{width:100%}
   rule (meant for the responsive bar/combo/histogram charts) would
   otherwise stretch a 1:1-aspect pie to the full card width. */
function pieChart(rows,{h=150,w=150,valueKey='value'}={}){
  const total=rows.reduce((s,r)=>s+(r[valueKey]||0),0)||1;
  const cx=w/2,cy=h/2,rad=Math.min(w,h)/2-8;
  let ang=-Math.PI/2,g='';
  rows.forEach((row,i)=>{
    const frac=(row[valueKey]||0)/total;
    if(frac<=0) return;
    const a0=ang,a1=Math.min(ang+frac*2*Math.PI,ang+2*Math.PI-0.0001);
    const x0=cx+rad*Math.cos(a0),y0=cy+rad*Math.sin(a0);
    const x1=cx+rad*Math.cos(a1),y1=cy+rad*Math.sin(a1);
    const large=(a1-a0)>Math.PI?1:0;
    g+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)}
      A${rad},${rad} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z"
      fill="${PIE_COLORS[i%PIE_COLORS.length]}"><title>${row.k}: ${M(row[valueKey])} (${(frac*100).toFixed(1)}%)</title></path>`;
    ang=a1;});
  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px;max-width:100%">${g}</svg>`;
}
const legend=(n,c)=>'<div class="lg">'+n.map((x,i)=>`<span><i style="background:${c[i]}"></i>${x}</span>`).join('')+'</div>';
const CCOL=['#0D0D0D','#22350E','#3B6D11','#4E8A1B','#639F2C','#7CB343','#96C463','#AFD289',
 '#C5DCA8','#555555','#6E6E6E','#888888','#A0A0A0','#B8B8B8','#8A6A17','#A6862F','#C2A455','#D8C58A'];
function stackedArea(months,cats,demand,{h=250}={}){
  const w=880,pad=40,n=months.length;
  const totals=months.map((_,i)=>cats.reduce((s,c)=>s+demand[c][i],0));
  const max=Math.max(...totals,1);

    g+=`<line class="gl" x1="${pad}" x2="${w}" y1="${gy}" y2="${gy}"/><text class="axl" x="4" y="${gy+3}">${(max*i/4).toFixed(0)}</text>`;}
  cats.forEach((c,ci)=>{const top=acc.map((a,i)=>a+demand[c][i]);
    const up=top.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    const dn=acc.map((v,i)=>`${X(i)},${Y(v)}`).reverse().join(' ');
    g+=`<polygon points="${up} ${dn}" fill="${CCOL[ci%CCOL.length]}" opacity=".95"><title>${c}</title></polygon>`;acc=top;});
  months.forEach((m,i)=>{if(i%3)return;g+=`<text class="axl" x="${X(i)}" y="${h-6}" text-anchor="middle">${m}</text>`;});
  const pk=totals.indexOf(Math.max(...totals));

      <text class="axl" x="${X(pk)+5}" y="20" fill="#8C2F27">peak ${totals[pk].toFixed(0)} FTE \u00b7 ${months[pk]}</text>`;
  g+=`<line class="ax" x1="${pad}" x2="${w}" y1="${h-20}" y2="${h-20}"/>`;
  return `<svg viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
function histogram(vals,{h=190,bins=10}={}){
  // Room at top for the y-axis title, bottom for the x-axis title.
  const w=420,pad=30,top=10,bot=32;const c=new Array(bins).fill(0);
  vals.forEach(v=>c[Math.min(bins-1,Math.floor(v*bins))]++);
  const max=Math.max(...c,1),bw=(w-pad-6)/bins;let g='';
  const plotH=h-top-bot;
  c.forEach((v,i)=>{const bh=(v/max)*plotH,x=pad+i*bw;
    g+=`<rect x="${x+2}" y="${top+plotH-bh}" width="${bw-4}" height="${bh}" fill="#3B6D11" rx="1"><title>${i*10}\u2013${(i+1)*10}% Pwin: ${v} pursuit${v===1?'':'s'}</title></rect>`;
    if(i%2===0)g+=`<text class="axl" x="${x+bw/2}" y="${h-18}" text-anchor="middle">${i*10}%</text>`;});
  for(let i=0;i<=3;i++){const gy=top+plotH-(i/3)*plotH;
    g+=`<line class="gl" x1="${pad}" x2="${w}" y1="${gy}" y2="${gy}"/><text class="axl" x="4" y="${gy+3}">${Math.round(max*i/3)}</text>`;}
  g+=`<line class="ax" x1="${pad}" x2="${w}" y1="${top+plotH}" y2="${top+plotH}"/>`;
  // Axis titles.
  g+=`<text class="axl" x="${pad+(w-pad)/2}" y="${h-4}" text-anchor="middle" style="font-weight:600">Pwin</text>`;
  // Pivot the rotation ON the text's own point (translate x,y then rotate),
  // not around the SVG origin -- that is what put the label between the
  // axis numbers instead of along the left edge.
  const ptY = top+plotH/2;
  g+=`<text class="axl" x="0" y="0" text-anchor="middle" transform="translate(12,${ptY}) rotate(-90)" style="font-weight:600">Pursuits</text>`;
  return `<svg viewBox="0 0 ${w} ${h}">${g}</svg>`;
}

/* Generic table renderer used when a chart is switched to table view. */

/* Single-year category breakdown (market or phase) switched between

function catBody(key,rows,tableCatCell){
  const t=DASH_CFG[key].type;
  if(t==='pie') return pieChart(rows)+legend(rows.map(r=>r.k),rows.map((_,i)=>PIE_COLORS[i%PIE_COLORS.length]));
  if(t==='bar') return barsGrouped([{name:'Value',v:rows.map(r=>r.value)}],rows.map(r=>r.k),['#3B6D11'])

  <tbody>${rows.map(r=>`<tr><td>${tableCatCell(r.k)}</td><td class="r num">${r.n}</td>
    <td class="r num">${M(r.value)}</td><td class="r num">${M(r.prob)}</td>
    <td class="r num">${r.pwin==null?'\u2014':(r.pwin*100).toFixed(1)+'%'}</td></tr>`).join('')}</tbody></table></div>`;

function chartOrTable(key,series,labels,colors,names){
  const t=DASH_CFG[key].type;
  if(t==='table') return seriesTable(series,labels,M);

  // Pie is never offered as an option for a card that reaches this
  // function (see PIE_CARDS / typeOpts) -- a five-year target-vs-actual

  return barsGrouped(series,labels,colors)+legend(names,colors);
}

/* ---------- Dashboard ---------- */
function vDash(){

/* ---------- Pursuits ---------- */
let sortKey='value',sortDir=-1,selUid=null;
let pageSize=50, page=1, detailMode=false;
let FLT={market:'',stage:'',bid:'',outcome:'',dep:'',q:'',pwin:'',dueYear:'',sole:''};
// Navigate from the dashboard summary to Pursuits, pre-filtered.
// Resets every other filter first: arriving with a stale filter from an
// earlier visit would silently hide pursuits the click implied should
// be visible.
window.goToPursuits = function(f){
  FLT = {market:'',stage:'',bid:'',outcome:'',dep:'',q:'',pwin:'',dueYear:'',sole:''};
  Object.assign(FLT, f);
  if(FLT.sole===true) FLT.sole='1';   // dropdown value is the string '1'
  dashFilterNote = Object.keys(f).length ? summarizeFilter(f) : '';
  page = 1;
  // show() only toggles which pre-rendered view is VISIBLE -- it does not
  // regenerate content. Without re-running vPursuits() first, the filter
  // change is set in state but never reaches the DOM.
  vPursuits();
  show('pursuits');
};
function summarizeFilter(f){
  const parts=[];
  if(f.outcome==='OPEN') parts.push('open pursuits');
  if(f.bid==='Bid') parts.push('marked Bid');
  if(f.sole) parts.push('sole source');
  if(f.dep) parts.push('with a dependency');
  if(f.pwin==='hi') parts.push('Pwin \u2265 50%');
  if(f.pwin==='lo') parts.push('Pwin < 20%');
  return parts.join(', ');
}
let dashFilterNote = '';

function applyFilters(list){
  return list.filter(x=>
    (!FLT.market||x.market===FLT.market)&&
    (!FLT.stage||x.stage===FLT.stage)&&
    (!FLT.bid||x.bid===FLT.bid)&&
    (!FLT.outcome||(FLT.outcome==='Open'?!x.outcome:x.outcome===FLT.outcome))&&
    (!FLT.dep||(FLT.dep==='child'?isDependent(x.uid):FLT.dep==='parent'?isDependedOn(x.uid)
        :FLT.dep==='any'?(isDependent(x.uid)||isDependedOn(x.uid))
        :!isDependent(x.uid)&&!isDependedOn(x.uid)))&&
    (!FLT.pwin||(FLT.pwin==='hi'?x.pwin>=.5:FLT.pwin==='mid'?(x.pwin>=.2&&x.pwin<.5):x.pwin<.2))&&
    (!FLT.sole||!!x.sole)&&
    (!FLT.dueYear||(x.due||'').slice(0,4)===FLT.dueYear)&&
    (!FLT.q||(x.name||'').toLowerCase().includes(FLT.q.toLowerCase())||String(x.opp_id||'').includes(FLT.q)));
}
const uniq=(k)=>[...new Set(P.map(x=>x[k]).filter(Boolean))].sort();

  const dueYears=[...new Set(P.map(x=>(x.due||'').slice(0,4)).filter(Boolean))].sort();

    if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*sortDir;});
  const pages=Math.max(1,Math.ceil(sorted.length/pageSize));

/* Question prompts \u2014 verbatim from PwinForm control captions.
   TM1a/TM1b vary by opportunity type (IsDevOrExistingProduct). */
const QSEC={'TM 1a':'Technical & Management','TM 1b':'Technical & Management',
 'TM 2':'Technical & Management','TM 3':'Technical & Management','TM 4':'Technical & Management',
 'TM 5':'Technical & Management','PP 1':'Past Performance','P 1':'Price','P 2':'Price'};
const QTXT={
 'TM 1a':{PRODUCT:'1a.  Does our product perform better than our competitor?',
          SERVICES:'1a.  Have we done a job like this before?'},
 'TM 1b':{PRODUCT:'1b.  Is our Technical Solution more mature than competitors?',
          SERVICES:'1b.  Have our competitors done a job like this before?'},
 'TM 2':'2.  Is there an incumbent?',
 'TM 3':'3.  Is the incumbent well-performing?',
 'TM 4':'4.  Will we need a teammate in order to bid key aspects of the job?',
 'TM 5':'5.  Do we plan to invest (other than B&P) to increase competitiveness prior to RFP release?',
 'PP 1':'1.  Do we have any performance issues on similar contracts within the last 3 years?',
 'P 1':'1.  How far above/below a normal bid are we planning for this proposal?',
 'P 2':'2.  Is this Best Value or LPTA?'};
const isProd=t=>{t=(t||'').toLowerCase();return t.includes('product')||t.includes('dev');};
function qPrompt(k,type){const v=QTXT[k];
  return typeof v==='string'?v:(isProd(type)?v.PRODUCT:v.SERVICES);}


/* Shared questionnaire renderer.
   Enforces every PwinForm gate:
     - P2 = LPTA disables TM1a / TM1b
     - SERVICES only: TM1a = "No" removes TM1b "not as many building blocks as us"
     - SERVICES only: neither TM1a nor TM1b a "yes" => TM2 can only be "No"
     - ALL types: TM2 determines the TM3 option list exactly
   Source: PwinForm.frm UpdateTM1bOptions_ / UpdateTM2Options_ / CB_TM2_Change */
const TM3_BY_TM2={
 'Yes, us':['We are performing satisfactorily/unknown','We have performance issues'],
 'Yes, one of the competitors':['Incumbent competitor is performing satisfactorily/unknown',
                                'Incumbent competitor has performance issues'],
 'No':['N/A']};
function optionsFor(k,ans,type){
  const prod=isProd(type), svc=!prod;
  let list=(QOPT[k]||[]).filter(o=>{
    if(k==='TM 1a'||k==='TM 1b'){
      const P=['Same','Better','Worse','Same Level','More Mature','Less Mature'];
      return prod ? P.includes(o) : !P.includes(o);
    }
    return true;});
  if(svc && k==='TM 1b' && ans['TM 1a']==='No')
    list=list.filter(o=>o!=='Yes, but not as many building blocks as us');
  if(svc && k==='TM 2'){
    const yA=ans['TM 1a']&&ans['TM 1a']!=='No', yB=ans['TM 1b']&&ans['TM 1b']!=='No';
    if(!yA&&!yB) list=['No'];
  }
  if(k==='TM 3') list=TM3_BY_TM2[ans['TM 2']]||['N/A'];
  return list;
}
/* Re-apply gates after any change, exactly as the form cascades. */
function cascade(ans,type){
  ['TM 1b','TM 2','TM 3'].forEach(k=>{
    const opts=optionsFor(k,ans,type);
    if(!opts.includes(ans[k])) ans[k]=opts[0];});
  return ans;
}
function renderQ(ans,baseAns,type,editable){
  const lpta = ans['P 2']==='LPTA';
  // Under LPTA the lowest technically acceptable price wins, so technical
  // merit, management and past performance stop discriminating. Only the
  // price posture and any investment still move the number.
  const LPTA_OFF = ['TM 1a','TM 1b','TM 2','TM 3','TM 4','PP 1'];
  let out='',sec='';
  Object.keys(QOPT).forEach(k=>{
    if(QSEC[k]!==sec){sec=QSEC[k];
      const secOff = lpta && (sec==='Technical & Management' || sec==='Past Performance');
      out+=`<div style="padding:8px 14px;background:#0D0D0D;color:#C5DCA8;font-size:9.5px;
        letter-spacing:.14em;text-transform:uppercase;font-weight:600">${sec}${
        secOff?' <span style="color:#8A8A8A;text-transform:none;letter-spacing:0"> \u2014 not scored under LPTA</span>':''}</div>`;}
    const dis = lpta && LPTA_OFF.includes(k);
    const changed = ans[k]!==baseAns[k];
    const opts=optionsFor(k,ans,type);
    const locked = opts.length===1 && (k==='TM 2'||k==='TM 3');
    let why='';
    if(dis) why=' &middot; not scored under LPTA';
    else if(k==='TM 2'&&locked) why=' &middot; forced: no prior experience in 1a or 1b';
    else if(k==='TM 3'&&locked) why=' &middot; forced by TM2';
    else if(k==='TM 3') why=' &middot; options set by TM2';
    else if(k==='TM 1b'&&!isProd(type)&&ans['TM 1a']==='No')
      why=' &middot; one option removed (TM1a = No)';
    out+=`<div class="q" style="${changed?'background:#EAF3DE;':''}${dis||locked?'opacity:.55;':''}">
      <label>${qPrompt(k,type)}${changed?' &middot; changed':''}${why}
        <span class="qhelp" onclick="showHelp('${k}','${(type||'').replace(/'/g,'')}')"
              title="What does this question mean?">?</span></label>
      <select data-a="${k}" ${dis||locked||!editable?'disabled':''}>
        ${opts.map(o=>`<option ${o===ans[k]?'selected':''}>${o}</option>`).join('')}
      </select></div>`;});
  return out;
}

/* ---------- Recalculate Pwin (Pre-BH questionnaire path only) ----------
   NEVER used by Black Hat/PTW -- that path is analyst-entered and never
   calls the engine. See api/app/recalc.py. */
async function recalculatePwin(uid){
  const r = P.find(x=>x.uid===uid);
  if(!r) return;
  const btn = document.getElementById('dCalc');
  if(btn){ btn.disabled = true; btn.textContent = 'Recalculating\u2026'; }
  try{
    const res = await fetch(`/api/pursuits/${r.id}/recalculate`, {
      method:'POST', credentials:'same-origin'});
    if(res.status===401){ showLogin(); return; }
    const body = await res.json().catch(()=>({}));
    if(!res.ok){
      const msg = typeof body.detail==='string' ? body.detail
                : (body.detail && body.detail[0] && body.detail[0].msg)
                  || `recalculation failed (${res.status})`;
      toast(msg, true);
      return;
    }
    await loadData();
    detailView(uid);
    toast(`Recalculated: Pwin ${pwinPct(body.pwin)}.`);
  }catch(e){ toast(`Could not reach the Pwin engine: ${e.message}`, true); }
}

/* ---------- Black Hat / PTW ----------
   Neither path calls the engine -- by this phase a real competitive
   analysis has already happened outside this system. Black Hat computes
   fee server-side (get_fee(contract) + P1 delta); PTW overrides fee
   directly with an analyst-entered margin. See ddl/13_bhptw_fee.sql. */
let bhptwUid = null;             // which pursuit the cache below belongs to
let BHPTW = null;                // /api/pursuits/{id}/bhptw response, cached
let bhptwMode = null;            // 'BLACK_HAT' | 'PTW' -- which form shows
let bhptwStep = 'BASE';          // 'BASE' | 'DEPENDENT_WON'
let bhptwBuf = {BASE:{}, DEPENDENT_WON:{}};   // in-progress field values

async function loadBhPtw(uid, r){
  try{
    const res = await fetch(`/api/pursuits/${r.id}/bhptw`, {credentials:'same-origin'});
    if(res.status===401){ showLogin(); return; }
    if(!res.ok) throw new Error(`bhptw fetch failed (${res.status})`);
    BHPTW = await res.json();
    if(uid===selUid && detailMode) detailView(uid);
  }catch(e){ toast(e.message, true); }
}

function bhptwCard(uid, r){
  if(bhptwUid !== uid){

  }
  if(!BHPTW){
    return `<div class="card" id="bhptwCard"><h3>${r.stage} assessment</h3>
      <div class="pad">Loading\u2026</div></div>`;
  }
  if(!BHPTW.has_questionnaire){
    return `<div class="card" id="bhptwCard"><h3>${r.stage} assessment</h3>
      <div class="note" style="background:#FBF4E2;color:#6B5320;padding:11px 14px;
        border-left:3px solid var(--warn)">Complete the Pwin questionnaire
        before entering Black Hat or PTW data for this pursuit.</div></div>`;
  }
  if(!bhptwMode) bhptwMode = r.stage==='Post-PTW' ? 'PTW' : 'BLACK_HAT';
  const hasDep = BHPTW.has_dependency;
  const scenario = hasDep ? bhptwStep : 'BASE';
  const cur = BHPTW.scenarios[scenario] || {};
  const buf = bhptwBuf[scenario];
  const val = k => Object.prototype.hasOwnProperty.call(buf,k) ? buf[k] : cur[k];
  const doneBase = !!BHPTW.scenarios.BASE;
  const doneDep = !!BHPTW.scenarios.DEPENDENT_WON;

  const modeRow = `<div class="fr edit"><label>Analysis type</label>
    <div class="fv"><label><input type="radio" name="bhptwMode" value="BLACK_HAT"
        ${bhptwMode==='BLACK_HAT'?'checked':''}> Black Hat</label>
      <label style="margin-left:16px"><input type="radio" name="bhptwMode" value="PTW"
        ${bhptwMode==='PTW'?'checked':''}> PTW</label></div></div>`;

  const depStepper = hasDep ? `<div class="note" style="background:#EAF3DE;color:#2C5209;padding:9px 14px">
      Dependent pursuit. Two assessments are required \u2014 one assuming
      <b>${BHPTW.depends_on_name}</b> is lost, one assuming it is won.
      <div style="margin-top:7px">
        <button class="btn ${scenario==='BASE'?'':'gh'}" id="bhStepBase" style="padding:2px 9px;font-size:11px">
          Base (no lift)${doneBase?' \u2713':''}</button>
        <button class="btn ${scenario==='DEPENDENT_WON'?'':'gh'}" id="bhStepDep" style="padding:2px 9px;font-size:11px">
          If ${BHPTW.depends_on_name} is won${doneDep?' \u2713':''}</button>
      </div></div>` : '';

  const blackHatFields = bhptwMode==='BLACK_HAT' ? bhRow('Price aggressiveness (P1)',
      `<select id="bhP1">${(REF&&REF.p1_options||[]).map(o=>
        `<option value="${o.code}" ${val('aggressiveness_option_code')===o.code?'selected':''}>${o.label}</option>`
      ).join('')}</select>`,
      'Fee = the contract type\u2019s nominal rate plus this option\u2019s delta \u2014 computed on save.') : '';

  const ptwFields = bhptwMode==='PTW' ? bhRow('Margin', pctInput('bhMargin', val('margin_rate'), {max:30}),
        'Capped at 30% \u2014 replaces the fee formula directly.')
    + bhRow('Bid price', moneyInput('bhBidPrice', val('bid_price')), '') : '';

  const common = bhRow('Investment', moneyInput('bhInvestment', val('investment')), '')
    + bhRow('Date completed', `<input id="bhCompleted" type="date" value="${val('completed_date')||''}">`, '')
    + bhRow('Predicted Pwin', pctInput('bhPwin', val('base_pwin'), {max:100}),
        'Typed directly \u2014 this phase\u2019s Pwin comes from the analysis, not the engine.');

  const submitLabel = hasDep
    ? `Save ${scenario==='BASE'?'base':'dependent-won'} assessment`
    : 'Save assessment';

  return `<div class="card" id="bhptwCard"><h3>${r.stage} assessment</h3>

    ${modeRow}

function wireBhPtwCard(uid, r){
  if(!BHPTW){ loadBhPtw(uid, r); return; }
  if(!BHPTW.has_questionnaire) return;
  const hasDep = BHPTW.has_dependency;
  const scenario = hasDep ? bhptwStep : 'BASE';

  $$('input[name="bhptwMode"]').forEach(el=>{
    el.onchange = e=>{ bhptwMode = e.target.value; detailView(uid); };
  });
  const sb = document.getElementById('bhStepBase');
  if(sb) sb.onclick = ()=>{ bhptwStep='BASE'; detailView(uid); };
  const sd = document.getElementById('bhStepDep');
  if(sd) sd.onclick = ()=>{ bhptwStep='DEPENDENT_WON'; detailView(uid); };

  const bind = (id, key, num)=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.onchange = e=>{
      let v = e.target.value;
      if(v===''){ bhptwBuf[scenario][key] = null; return; }
      bhptwBuf[scenario][key] = num ? +v : v;
    };
  };
  bind('bhP1', 'aggressiveness_option_code', false);
  bind('bhMargin', 'margin_rate', true);
  bind('bhBidPrice', 'bid_price', true);
  bind('bhInvestment', 'investment', true);
  bind('bhCompleted', 'completed_date', false);
  bind('bhPwin', 'base_pwin', true);

  const submit = document.getElementById('bhSubmit');
  if(submit) submit.onclick = ()=>submitBhPtw(uid, r, scenario);
}

async function submitBhPtw(uid, r, scenario){
  const cur = BHPTW.scenarios[scenario] || {};
  const buf = bhptwBuf[scenario];
  const val = k => Object.prototype.hasOwnProperty.call(buf,k) ? buf[k] : cur[k];

  const basePwinPct = val('base_pwin');
  if(basePwinPct==null){ toast('Enter a predicted Pwin.', true); return; }
  const body = {
    scenario,
    investment: val('investment'),
    completed_date: val('completed_date') || null,
    base_pwin: +(basePwinPct/100).toFixed(6),
  };
  let path;
  if(bhptwMode==='BLACK_HAT'){
    if(!val('aggressiveness_option_code')){ toast('Choose a price aggressiveness option.', true); return; }
    body.aggressiveness_option_code = val('aggressiveness_option_code');
    path = 'blackhat';
  } else {
    const marginPct = val('margin_rate');
    if(marginPct==null){ toast('Enter a margin.', true); return; }
    if(val('bid_price')==null){ toast('Enter a bid price.', true); return; }
    body.margin_rate = +(marginPct/100).toFixed(6);
    body.bid_price = val('bid_price');
    path = 'ptw';
  }

  try{
    const res = await fetch(`/api/pursuits/${r.id}/${path}`, {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)});
    if(res.status===401){ showLogin(); return; }
    const resBody = await res.json().catch(()=>({}));
    if(!res.ok){
      const msg = typeof resBody.detail==='string' ? resBody.detail
                : (resBody.detail && resBody.detail[0] && resBody.detail[0].msg)
                  || `save failed (${res.status})`;
      toast(msg, true); return;
    }
    bhptwBuf[scenario] = {};
    // Advance to the second assessment a dependent pursuit still needs,
    // rather than leaving the analyst to notice it themselves.
    if(BHPTW.has_dependency && scenario==='BASE' && !BHPTW.scenarios.DEPENDENT_WON){
      await loadBhPtw(uid, r);
      bhptwStep = 'DEPENDENT_WON';
      toast(`Base assessment saved. Now enter the assessment assuming `
          + `${BHPTW.depends_on_name} is won.`);
      detailView(uid);
      return;
    }
    await loadBhPtw(uid, r);
    await loadData();
    detailView(uid);
    toast('Saved.');
  }catch(e){ toast(`Could not save: ${e.message}`, true); }
}

/* ---------- Staffing ---------- */
function vStaffing(){
  const s=D.staffing;
  if(!s.months.length || !s.cats.length){
    setHTML('#staffing', `<div class="card"><h3>Staffing capacity</h3>
      <div class="pad"><p style="margin:0">No staffing demand to show. Capacity
      is drawn from pursuits marked Bid that have a proposal due date.</p></div></div>`);
    return;
  }

  // ---- 5-year window, defaulting to the current planning year --------
  if(staffWinStart===null) staffWinStart = PY;
  const allYears=[...new Set(s.months.map(m=>+m.slice(0,4)))];
  const lo=Math.min(...allYears), hi=Math.max(...allYears);
  // Clamp so the window always contains at least some real data even if
  // the default (current year) sits outside the range the pipeline
  // actually covers.
  if(staffWinStart<lo) staffWinStart=lo;
  if(staffWinStart>hi) staffWinStart=hi;
  const winEnd=staffWinStart+4;
  const idx = s.months.map((m,i)=>i)
    .filter(i=>{const y=+s.months[i].slice(0,4); return y>=staffWinStart&&y<=winEnd;});
  const months = idx.map(i=>s.months[i]);
  const demand = {}; s.cats.forEach(c=>{ demand[c]=idx.map(i=>s.demand[c][i]); });
  const total = idx.map(i=>s.total[i]);

  if(!months.length){
    setHTML('#staffing', `<div class="card"><h3>Staffing capacity</h3>
      <div class="pad"><p style="margin:0">No staffing demand in ${staffWinStart}\u2013${winEnd}.
      Data covers ${lo}\u2013${hi} \u2014 use the window selector above to
      move into that range.</p></div></div>`);
    return;
  }

  const peak=Math.max(...total), peakM=months[total.indexOf(peak)];

  // "Highest single category": WHEN it peaks, not just how much -- the
  // year and month, so the number means something without cross-checking
  // the table beneath it.
  const catTot=s.cats.map(c=>{
    const series=demand[c];
    const pk=Math.max(...series);
    const pkMonth = pk>0 ? months[series.indexOf(pk)] : null;
    return {c, peak:pk, peakMonth:pkMonth, tot:series.reduce((a,b)=>a+b,0)};
  });
  const topCat = catTot.slice().sort((a,b)=>b.peak-a.peak)[0];

  // Total effort BY YEAR within the window, not one number smeared across
  // however many years happen to be visible.
  const yearsInWin = [...new Set(months.map(m=>+m.slice(0,4)))];
  const effortByYear = yearsInWin.map(y=>({
    y, total: idx.filter(i=>+s.months[i].slice(0,4)===y)
                 .reduce((sum,i)=>sum+s.total[i],0)}));
  const grand = effortByYear.reduce((a,b)=>a+b.total,0);

  const mx=Math.max(...s.cats.flatMap(c=>demand[c]));
  const heat=v=>{if(v<=0)return '';const t=Math.min(1,v/mx);
    return `background:rgba(59,109,17,${(0.06+t*0.62).toFixed(3)});color:${t>0.55?'#fff':'#333'}`;};
  // 2-digit year, smaller -- "2026-01" x 60 months across a table header
  // reads as noise; "26-01" reads as a date.
  const shortMonth = m => m.slice(2);

  setHTML('#staffing', `
  <div class="flag">Window: <b>${staffWinStart}\u2013${winEnd}</b> (data available ${lo}\u2013${hi}).</div>
  <div class="kpis">
    <div class="kpi hl"><div class="k">Peak demand</div><div class="v num">${peak.toFixed(0)} FTE</div>
      <div class="s">${peakM}</div></div>
    <div class="kpi"><div class="k">Highest single category</div>
      <div class="v num">${topCat.peak.toFixed(1)}</div>
      <div class="s">${topCat.c}${topCat.peakMonth?` \u00b7 ${topCat.peakMonth}`:''}</div></div>
    <div class="kpi" style="grid-column:span 2">
      <div class="k">Total effort by year <span style="font-weight:400;text-transform:none;letter-spacing:0">(FTE-months)</span></div>
      <div style="display:flex;gap:16px;margin-top:6px;flex-wrap:wrap">${
        effortByYear.map(y=>`<div style="text-align:left"><div style="font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em">${y.y}</div><div class="num" style="font-size:18px;font-weight:600;margin-top:1px">${y.total.toFixed(0)}</div></div>`).join('')}</div>
      <div class="s" style="margin-top:6px">${grand.toFixed(0)} total in window</div></div>
    <div class="kpi"><div class="k">Window</div><div class="v num">${months.length} mo</div>
      <div class="s">${months[0]} \u2013 ${months[months.length-1]}</div></div>
  </div>
  <div class="card"><h3>Portfolio FTE demand by month <small>stacked by labor category</small></h3>
    ${stackedArea(months,s.cats,demand)}${legend(s.cats,s.cats.map((_,i)=>CCOL[i%CCOL.length]))}</div>
  <div class="card"><h3>Labor category by month <small>FTE \u00b7 peak row at foot</small></h3>
   <div class="tw staff-scroll"><table class="staff-tbl"><thead><tr><th style="position:sticky;left:0;background:#EDEDED;z-index:2">Labor category</th>
     ${months.map(m=>`<th class="r">${shortMonth(m)}</th>`).join('')}<th class="r">Peak</th><th class="r">Total</th></tr></thead>
   <tbody>${s.cats.map(c=>`<tr><td style="position:sticky;left:0;background:#fff">${c}</td>
     ${demand[c].map(v=>`<td class="r num"><span class="heat" style="${heat(v)}">${v>0?v.toFixed(1):'\u00b7'}</span></td>`).join('')}
     <td class="r num"><b>${Math.max(...demand[c]).toFixed(1)}</b></td>
     <td class="r num">${demand[c].reduce((a,b)=>a+b,0).toFixed(0)}</td></tr>`).join('')}
   </tbody><tfoot><tr><td style="position:sticky;left:0;background:#F7F7F7">Peak FTE by month</td>
     ${total.map(v=>`<td class="r num"${v===peak?' style="color:#8C2F27"':''}>${v.toFixed(0)}</td>`).join('')}
     <td class="r num" style="color:#8C2F27">${peak.toFixed(0)}</td><td class="r num">${grand.toFixed(0)}</td></tr></tfoot></table></div>
   <div class="note">Demand is spread from each pursuit's proposal due date backward across its
     phase durations, matching the engine's staffing model. Cell shading is relative to the
     highest single category-month in this window.</div></div>`);
}

async function saveTargets(){
  const years = Object.keys(targetBuf);
  try{
    for(const y of years){
      const payload = {};
      for(const [uiKey,val] of Object.entries(targetBuf[y]))
        payload[TARGET_UI_TO_API[uiKey]] = val;
      const res = await fetch(`/api/plan-years/${y}`, {
        method:'PUT', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)});
      if(res.status===401){ showLogin(); return; }
      if(!res.ok){
        const body = await res.json().catch(()=>({}));
        const d = body.detail;
        const msg = typeof d==='string' ? d
                  : (d && (d.message || (d[0]&&d[0].msg)))
                    || `save failed for ${y} (${res.status})`;
        toast(msg, true);
        return;
      }
    }
    targetBuf = {};
    // Same load path as everywhere else -- loadData() rebuilds TG from
    // the fresh D.targets inside rebuildDerived(), and render() redraws
    // every view including the dashboard's charts, so this closes the
    // loop without any separate propagation step.
    if(await loadData()){ render(); show(cur); }
    toast('Saved.');
  }catch(e){ toast(`Could not save: ${e.message}`, true); }
}

const SCORED_UI_KEYS=['TM 1a','TM 1b','TM 2','TM 3','TM 4','TM 5','PP 1','P 1'];
async function sbRecalcOne(uid){
  const x=P.find(p=>p.uid===uid), s=SB[uid];
  if(!x||!s) return;
  const answers={};
  SCORED_UI_KEYS.forEach(k=>{ if(s.ans[k]) answers[k.replace(/\s+/g,'').toUpperCase()]=s.ans[k]; });
  try{
    const res=await fetch(`/api/pursuits/${x.id}/recalculate/preview`,{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({answers})});
    if(res.status===401){ showLogin(); return; }
    const body=await res.json().catch(()=>({}));
    s.pending=false;
    if(!res.ok){
      const msg = typeof body.detail==='string' ? body.detail
                : (body.detail && body.detail[0] && body.detail[0].msg)
                  || `recalculation failed (${res.status})`;
      toast(msg, true); return;
    }
    s.pwin=body.pwin; s.dirty=false;
  }catch(e){ s.pending=false; toast(`Could not reach the Pwin engine: ${e.message}`, true); }
}
function sbQ(uid){
  const x=P.find(p=>p.uid===uid),s=SB[uid];
  if(!x||!s){ sbSel=null; return; }
  const kids=DEPENDENTS[uid]||[], parent=DEPS_OF[uid];
  const nch=Object.keys(x.answers).filter(k=>s.ans[k]!==x.answers[k]).length;
  $('#sbq').innerHTML=`<div class="card"><h3>Pwin questionnaire \u2014 ${x.name}
     <small>${x.type||''} \u00b7 ${x.bidders??'?'} bidders</small></h3>
   <div class="sc" style="border-bottom:1px solid var(--line);background:#FAFAFA">
     <div>Current Pwin<b>${pwinPct(effectivePwin(x))}</b></div>
     <div>Scenario Pwin<b>${s.dirty?'recalculate':pwinPct(s.pwin)}</b></div>
     <div>Answers changed<b>${nch}</b></div>
     <div>Bidders<b>${x.bidders??'\u2014'}</b></div>
   </div>
   ${(kids.length||parent)?`<div class="note" style="background:#EAF3DE;color:#2C5209;padding:9px 14px">
     ${parent?`This pursuit depends on <b>${oppName(parent)}</b> (ID ${oppRef(parent)}) \u2014 its Pwin is conditional on that award. `:''}
     ${kids.length?`<b>${kids.length}</b> pursuit(s) depend on this one: ${kids.map(v=>oppName(v)+' (ID '+oppRef(v)+')').join(', ')} \u2014 changing this Pwin re-solves theirs.`:''}
   </div>`:''}
   <div class="qa">${renderQ(s.ans,x.answers,x.type,true)}</div>
   <div class="pad" style="display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)">
     <button class="btn" id="sbCalc">Recalculate Pwin</button>
     <button class="btn gh" id="sbRevert">Revert this pursuit</button>
     <span style="font-size:11px;color:#888;margin-left:auto">Pwin is computed by the engine.</span></div></div>`;
  $$('#sbq [data-a]').forEach(sel=>sel.onchange=e=>{
    SB[uid].ans[e.target.dataset.a]=e.target.value;
    cascade(SB[uid].ans, x.type);
    SB[uid].dirty=JSON.stringify(SB[uid].ans)!==JSON.stringify(x.answers);
    vSandbox();});
  $('#sbRevert').onclick=()=>{SB[uid].ans={...x.answers};SB[uid].dirty=false;SB[uid].pending=false;SB[uid].pwin=x.pwin;vSandbox();};
  $('#sbCalc').onclick=async()=>{SB[uid].pending=true;vSandbox();
    await sbRecalcOne(uid); vSandbox(); sbQ(uid);};
  $('#sbq').scrollIntoView({behavior:'smooth',block:'nearest'});
}

const UI_TO_API = {name:'name', opp_id:'external_opportunity_id',
  market:'market_code', type:'opportunity_type_code',

  sole:'is_sole_source', bidders:'bidders',

/* Keyed by the UI field name, which is what fieldRow() is given. Keying
   this by API name was a real bug: nothing matched, so every derived field
   rendered as an editable input. */
const DERIVED_WHY = {
  fee: 'Nominal rate for the contract type, adjusted by the price '
    + 'aggressiveness chosen at Black Hat. Set on the Black Hat or PTW form.',
  inv: 'Investment amount, entered on the Black Hat or PTW form.',
  bp_start: 'Calculated by the staffing model, working backward from the '
    + 'proposal due date across the phase durations.',
  pwin: 'Computed by the engine. Change the questionnaire answers to move it.',
};

function fieldRow(r, key, label, opts){
  opts = opts || {};
  const val = r[key];
  const why = DERIVED_WHY[key];
  if(why){
    return `<div class="fr derived"><label>${label}</label>
      <div class="fv">${opts.fmt ? opts.fmt(val) : (val ?? '\u2014')}
        <span class="lockwhy" title="${why}">derived</span></div></div>`;
  }
  // editBuf is keyed by API field name; the row knows its UI name. One map,
  // consulted in both directions, so a rename cannot desynchronise them.
  const apiKey = UI_TO_API[key];
  const dirty = apiKey && Object.prototype.hasOwnProperty.call(editBuf, apiKey);
  const shown = dirty ? editBuf[apiKey] : val;
  let input;
  if(opts.type === 'select'){
    input = `<select data-ed="${key}">
      ${opts.blank ? `<option value="">\u2014</option>` : ''}
      ${(opts.options||[]).map(o=>
        `<option value="${o.code}" ${String(shown)===String(o.code)?'selected':''}
          >${o.label}</option>`).join('')}</select>`;
  } else if(opts.type === 'bool'){
    input = `<label class="tg"><input type="checkbox" data-ed="${key}"
      ${shown?'checked':''}><span></span></label>`;
  } else {
    const raw = `<input data-ed="${key}" type="${opts.type||'text'}"
      ${opts.step?`step="${opts.step}"`:''} ${opts.min!=null?`min="${opts.min}"`:''}
      ${opts.max!=null?`max="${opts.max}"`:''}
      value="${shown==null?'':String(shown).replace(/"/g,'&quot;')}">`;
    // A currency or percentage box should say so. Cheaper and less
    // error-prone than formatting the value itself, which fights the
    // number input on every keystroke.
    input = opts.sym
      ? `<span class="adorn ${opts.sym==='%'?'pct':''}" data-sym="${opts.sym}">${raw}</span>`
      : raw;
  }
  return `<div class="fr edit${dirty?' dirty':''}"><label>${label}</label>
    <div class="fv">${input}${opts.note?`<span class="fnote${opts.warnNote?' warn':''}">${opts.note}</span>`:''}</div></div>`;
}

function editBar(){
  const n = Object.keys(editBuf).length;
  if(!n) return '';

async function saveEdits(uid){
  const r = P.find(x=>x.uid===uid);
  if(!r || !Object.keys(editBuf).length) return;
  const payload = {expected_updated_at: r.updated_at, ...editBuf};
  try{
    const res = await fetch(`/api/pursuits/${r.id}`, {
      method:'PATCH', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)});
    if(res.status===401){ showLogin(); return; }
    const body = await res.json().catch(()=>({}));
    if(res.status===409){
      const d = body.detail || {};
      if(d.error==='modified'){
        toast(`${d.message} Changed by ${d.changed_by||'someone else'}. `
              + `Reload to see their version.`, true);
        return;
      }
      toast(typeof d==='string'?d:(d.message||'Conflict'), true);
      return;
    }
    if(!res.ok){
      const msg = typeof body.detail==='string' ? body.detail
                : (body.detail && body.detail[0] && body.detail[0].msg)
                  || `save failed (${res.status})`;
      toast(msg, true); return;
    }
    editBuf = {}; editUid = null;
    await loadData();              // re-read so derived values refresh too
    detailView(uid);
    // Sole source was turned off but the stored Pwin is still the 95%
    // business-rule value -- it no longer describes a competitive
    // situation and must not be trusted for this pursuit until it is
    // recalculated. Real popup, not a toast: this is a data-integrity
    // condition, not routine confirmation, and should require dismissal.
    if(body.pwin_needs_recalc){
      alert(`Saved. This pursuit is no longer sole source, but its Pwin `
        + `(${pwinPct(body.pwin)}) still reflects the sole-source rule, `
        + `not a competitive assessment.

Answer the Pwin questionnaire `
        + `and click Recalculate Pwin before relying on this number.`);
    } else {
      toast('Saved.');
    }
  }catch(e){ toast(`Could not save: ${e.message}`, true); }
}

async function setOutcome(uid, outcome, alsoBid){
  const r = P.find(x=>x.uid===uid);
  const res = await fetch(`/api/pursuits/${r.id}/outcome`, {
    method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({outcome: outcome||null, also_set_bid: !!alsoBid})});
  const body = await res.json().catch(()=>({}));
  if(res.status===409 && body.detail && body.detail.error==='bid_required'){
    // The rule, surfaced as a choice rather than a refusal.
    if(confirm(`${body.detail.message}

Mark it as Bid and continue?`)){
      return setOutcome(uid, outcome, true);
    }
    return false;
  }
  if(!res.ok){
    toast(typeof body.detail==='string'?body.detail:'Could not set outcome', true);
    return false;
  }
  await loadData(); detailView(uid);
  toast(outcome ? `Recorded as ${outcome.toLowerCase()}.` : 'Pursuit reopened.');
  return true;
}

/* ---------- change history ----------
   The API returns RAW field diffs. All presentation happens in formatDiff()
   -- one function. Switching to plain language later ("changed the bid
   decision to No bid") means replacing this function and adding a label
   map, not touching every call site. That is the only reason raw is a
   cheap choice now. */
const FIELD_LABEL = {
  bid_decision:'Bid decision', name:'Opportunity name', bidders:'Expected bidders',
  external_opportunity_id:'Opportunity ID', outcome_date:'Outcome date',
  depends_on_pursuit_id:'Depends on', org_node_id:'Business unit',
  opportunity_type_id:'Opportunity type', contract_type_id:'Contract type',
  market_id:'Market', pipeline_stage_id:'Competitive analysis phase',
  updated_by:'Last edited by', period_end_date:'Contract end date',
  is_sole_source:'Sole source', planned_total_award_value:'Award value',
  planned_fee_rate:'Fee rate', planned_investment:'Investment',
  bp_start_date:'B&P start', proposal_due_date:'Proposal due',
  contract_award_date:'Contract award', period_end_date:'Period end',
  outcome:'Outcome', is_active:'Active', updated_at:'Last updated',
  pwin:'Pwin', market_id:'Market', pipeline_stage_id:'Phase'};
const HIDE_FIELDS = new Set(['updated_at','updated_by','created_at','created_by']);

// Identifiers are not quantities. "1146" is an opportunity ID, not 1,146.
const ID_FIELDS = new Set(['external_opportunity_id','depends_on_pursuit_id']);
function fmtVal(v, field){
  if(v===null||v===undefined) return '<i>empty</i>';
  if(typeof v==='boolean') return v?'Yes':'No';
  const s=String(v);
  if(ID_FIELDS.has(field)) return s;
  if(typeof v==='number') return v.toLocaleString('en-US');
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)) return s.slice(0,16).replace('T',' ');
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^-?\d+(\.\d+)?$/.test(s)) return (+s).toLocaleString('en-US');
  return s;
}
function formatDiff(changed){
  if(!changed) return '<span style="color:#888">no detail</span>';
  if(changed.new)     return '<span class="chg up2">created</span>';
  if(changed.deleted) return '<span class="chg dn2">deleted</span>';
  const rows = Object.keys(changed)
    .filter(k=>!HIDE_FIELDS.has(k))
    .map(k=>`<div class="dif"><b>${FIELD_LABEL[k]||k}</b>
       <span class="was">${fmtVal(changed[k].from, k)}</span>
       <span class="arr">&rarr;</span>
       <span class="now">${fmtVal(changed[k].to, k)}</span></div>`);
  return rows.length ? rows.join('')
    : '<span style="color:#888">timestamp only</span>';
}
function ago(iso){
  if(!iso) return '';
  const d = (Date.now() - new Date(iso).getTime())/1000;
  if(d < 60) return 'just now';
  if(d < 3600) return Math.round(d/60)+' min ago';
  if(d < 86400) return Math.round(d/3600)+' hr ago';
  return Math.round(d/86400)+' days ago';
}

/* ---------- presence ----------
   Advisory. It never blocks a write -- the 409 on save does that. */
let presenceTimer = null, presenceFor = null;
async function presenceStart(pursuitId){
  presenceStop();
  presenceFor = pursuitId;
  const beat = async ()=>{
    if(presenceFor !== pursuitId) return;
    try{
      const r = await fetch(`/api/pursuits/${pursuitId}/presence`,
        {method:'POST', credentials:'same-origin'});
      if(!r.ok) return;
      const {others} = await r.json();
      const el = document.getElementById('presence');
      if(!el) return;
      if(others && others.length){
        el.className = 'presence show';
        el.innerHTML = others.map(o=>
          `<b>${o.display_name||o.email}</b> also has this open
           (since ${ago(o.opened_at)})`).join(' &middot; ') +
          ` &mdash; your changes will be checked against theirs when you save.`;
      } else { el.className='presence'; el.innerHTML=''; }
    }catch(e){ /* presence is advisory; a failure must not disrupt anything */ }
  };
  beat();
  presenceTimer = setInterval(beat, 45000);
}
function presenceStop(){
  if(presenceTimer){ clearInterval(presenceTimer); presenceTimer=null; }
  if(presenceFor){
    // Best effort. If it does not land, the row expires on its own.
    fetch(`/api/pursuits/${presenceFor}/presence`,
      {method:'DELETE', credentials:'same-origin'}).catch(()=>{});
    presenceFor = null;
  }
}

/* ---------- Portfolio change polling ----------
   Distinct from presence: presence says someone else has THIS pursuit
   open right now; this says the PORTFOLIO changed since the page loaded
   -- unrelated concerns, both run at once.

   __CPDE_TEST_POLL_MS is deliberately a bare JS global, not a URL query
   param or any UI control -- reachable only by running script before
   the page's own script executes (Playwright's addInitScript, or a
   devtools console), never by a link a real user could click or share. */
let changePollTimer = null;
let pollingEnabled = false;
let changesSince = null;
const changePollIntervalMs = ()=> window.__CPDE_TEST_POLL_MS || 60000;

function startChangePolling(){ pollingEnabled = true; armPollTimer(); }
function stopChangePolling(){
  pollingEnabled = false;
  if(changePollTimer){ clearTimeout(changePollTimer); changePollTimer = null; }
}
function armPollTimer(){
  if(changePollTimer){ clearTimeout(changePollTimer); changePollTimer = null; }
  if(!pollingEnabled || document.visibilityState==='hidden') return;
  changePollTimer = setTimeout(pollChangesTick, changePollIntervalMs());
}
async function pollChangesTick(){
  changePollTimer = null;
  if(!pollingEnabled || document.visibilityState==='hidden') return;
  try{
    const res = await fetch(`/api/changes?since=${encodeURIComponent(changesSince)}`,
      {credentials:'same-origin'});
    if(res.ok){
      const body = await res.json();
      if(body.count>0) showChangeBanner();
      // Advance the cursor whether or not anything changed -- otherwise
      // the same window keeps getting re-queried and, worse, a change
      // landing in the gap between two polls could be missed if the
      // cursor never moved forward past it.
      if(body.latest) changesSince = body.latest;
    }
  }catch(e){ /* advisory only -- a failed poll must not disrupt anything */ }
  armPollTimer();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){
    if(changePollTimer){ clearTimeout(changePollTimer); changePollTimer=null; }
  } else {
    armPollTimer();
  }
});
function ensureChangeBanner(){
  let el = document.getElementById('changeBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'changeBanner';
    el.innerHTML = `<span>Portfolio updated \u2014 some pursuits changed since this loaded.</span>
      <button id="changeBannerRefresh" type="button">Refresh</button>
      <button id="changeBannerClose" type="button" class="x" aria-label="Dismiss">&times;</button>`;
    document.body.appendChild(el);
    el.querySelector('#changeBannerRefresh').onclick = async ()=>{
      hideChangeBanner();
      if(await loadData()){
        render(); show(cur);
        // Re-arm relative to now -- otherwise a poll timer left over from
        // before the refresh could fire moments later and re-show the
        // banner for a change the reload just picked up.
        armPollTimer();
      }
    };
    el.querySelector('#changeBannerClose').onclick = ()=>{ hideChangeBanner(); };
  }
  return el;
}
function showChangeBanner(){ ensureChangeBanner().classList.add('show'); }
function hideChangeBanner(){
  const el = document.getElementById('changeBanner');
  if(el) el.classList.remove('show');
}

async function loadHistory(pursuitId){
  const el = document.getElementById('histBody');
  if(!el) return;
  el.innerHTML = '<div class="note">Loading\u2026</div>';
  try{
    const r = await fetch(`/api/pursuits/${pursuitId}/history`,
      {credentials:'same-origin'});
    if(!r.ok) throw new Error('history unavailable');
    const rows = await r.json();
    if(!rows.length){ el.innerHTML =
      '<div class="note">No recorded changes since this pursuit was imported.</div>';
      return; }
    el.innerHTML = `<div class="tw"><table><thead><tr>
        <th style="width:150px">When</th><th style="width:170px">Who</th>
        <th>Change</th></tr></thead><tbody>` +
      rows.map(h=>`<tr>
        <td class="num" title="${h.occurred_at}">${ago(h.occurred_at)}</td>
        <td>${h.actor_name || h.actor || '<i>system</i>'}</td>
        <td>${formatDiff(h.changed_fields)}</td></tr>`).join('') +
      `</tbody></table></div>`;
  }catch(e){
    el.innerHTML = `<div class="note">Could not load history: ${e.message}</div>`;
  }
}

/* ---------- writes ---------- */
/* Optimistic with revert. The toggle must feel instant, but a failed write
   must not leave the screen showing something the database does not. */
function toast(msg, bad){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.className = bad ? 'bad show' : 'show';
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.className=''; }, bad ? 6000 : 2500);
}

async function saveBid(uid, wantBid){
  const pursuit = P.find(x=>x.uid===uid);
  if(!pursuit) return false;
  const prev = BID[uid];
  BID[uid] = wantBid;                    // optimistic
  render(); show(cur);
  try{
    const r = await fetch(`/api/pursuits/${pursuit.id}/bid`, {
      method:'PATCH', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({bid: wantBid})});
    if(r.status===401){ showLogin(); return false; }
    if(!r.ok){
      const body = await r.json().catch(()=>({}));
      throw new Error(body.detail || `save failed (${r.status})`);
    }
    pursuit.bid = wantBid ? 'Bid' : 'No Bid';
    toast(`${pursuit.name}: ${wantBid?'Bid':'No bid'}`);
    return true;
  }catch(e){
    BID[uid] = prev;                     // revert
    render(); show(cur);
    toast(`Could not save: ${e.message}`, true);
    return false;
  }
}

/* ---------- data loading ---------- */
function rebuildDerived(){
  PY = D.planning_year || PY;
  YRS = [0,1,2,3,4].map(i=>PY+i);
  P = D.pursuits || [];
  OPEN = P.filter(x=>!x.outcome);
  DECIDED = P.filter(x=>x.outcome);

  // uid MUST be set before anything keys off it. The API has no internal
  // surrogate in its payload -- the user-facing opportunity id is the key.
  P.forEach(x=>{x.uid = x.opp_id;});

  Object.keys(BID).forEach(k=>delete BID[k]);
  P.forEach(x=>{BID[x.uid] = x.bid!=='No Bid';});

  Object.keys(BY_UID).forEach(k=>delete BY_UID[k]);
  Object.keys(DEPS_OF).forEach(k=>delete DEPS_OF[k]);
  Object.keys(DEPENDENTS).forEach(k=>delete DEPENDENTS[k]);
  Object.keys(DEP_NAME).forEach(k=>delete DEP_NAME[k]);
  // The API keys dependencies by opportunity id, which is what the user sees.
  P.forEach(x=>{BY_UID[x.opp_id]=x;});
  P.forEach(x=>{
    if(x.dep){
      DEPS_OF[x.opp_id]=x.dep;
      (DEPENDENTS[x.dep]=DEPENDENTS[x.dep]||[]).push(x.opp_id);
      if(x.dep_name) DEP_NAME[x.dep]=x.dep_name;
    }});
  Object.keys(TG).forEach(k=>delete TG[k]);
  (D.targets||[]).forEach(t=>{TG[t.year]={
    year:t.year, esc:+t.esc||0,
    rev_target:+t.rev_target||0, fee_target:+t.fee_target||0,
    bp_budget:+t.bp_budget||0, inv_budget:+t.inv_budget||0,
    other_rev:+t.other_rev||0, other_fee:+t.other_fee||0};});
  YRS.forEach(y=>{ if(!TG[y]) TG[y]={year:y,rev_target:0,fee_target:0,
    bp_budget:0,inv_budget:0,esc:0,other_rev:0,other_fee:0}; });

  SB = null;   // sandbox is a copy of the portfolio; rebuild it
}

function numify(x){
  // psycopg returns NUMERIC as strings to preserve precision. The views do
  // arithmetic, so coerce once here rather than at every call site.
  ['value','fee','pwin','base_pwin','blended_pwin','invpct','inv','bp','prob']
    .forEach(k=>{ if(x[k]!=null) x[k]=+x[k]; });
  (x.years||[]).forEach(y=>['rev','fee','bp','inv'].forEach(k=>y[k]=+y[k]||0));
  return x;
}

async function loadData(){
  const r = await fetch('/api/bootstrap', {credentials:'same-origin'});
  if(r.status===401){ showLogin(); return false; }
  if(!r.ok) throw new Error('bootstrap failed: '+r.status);
  const data = await r.json();
  data.pursuits = (data.pursuits||[]).map(numify);
  D = data;
  // The change-poll cursor resets on every successful load, manual
  // refreshes included -- whatever is fresh as of THIS load is the new
  // baseline, so the same change is never reported twice.
  changesSince = data.latest || new Date().toISOString();
  // A new payload means every selection, filter and buffer from the previous
  // one is stale -- and if the tenant changed, actively wrong.
  selUid = null; detailMode = false; editBuf = {}; editUid = null;
  sbSel = null; page = 1;
  rebuildDerived();
  const ft = document.querySelector('.side-ft');
  if(ft){
    ft.innerHTML = `${(D.client&&D.client.name)||''}` +
      `<span id="pyLbl">Planning year ${PY}</span>` +
      `<span style="color:#6E6E6E">${D.user?D.user.email:''}</span>` +
      `<button class="btn gh" id="signOut">Sign out</button>`;
    $('#signOut').onclick = async ()=>{
      await fetch('/api/logout',{method:'POST',credentials:'same-origin'});
      // Drop everything in memory. A stale portfolio must not survive a
      // sign-out -- the next user may be a different tenant entirely.
      D = {pursuits:[],targets:[],staffing:{months:[],cats:[],demand:{},total:[]},
           planning_year:PY};
      rebuildDerived();
      presenceStop();
      stopChangePolling();
      hideChangeBanner();
      SB = null; sbSel = null; selUid = null; detailMode = false; page = 1;
      editBuf = {}; editUid = null; REF = null;
      sortKey = 'value'; sortDir = -1;
      FLT = {market:'',stage:'',bid:'',outcome:'',dep:'',q:'',pwin:'',dueYear:''};
      cur = 'dash';          // a new session starts at the dashboard
      showLogin();
    };
  }
  return true;
}

function showLogin(){
  document.querySelector('.app').style.display='none';
  let el = document.getElementById('loginScreen');
  if(!el){
    el = document.createElement('div');
    el.id='loginScreen';
    el.innerHTML = `<div class="loginbox">
      <h1>CDA</h1><span>Pipeline Decision Engine</span>
      <label>Email</label>
      <input id="loginEmail" type="text" placeholder="you@company.com"
             autocomplete="username">
      <button class="btn" id="loginGo">Sign in</button>
      <div class="err" id="loginErr"></div>
      <div class="hint">Local development sign-in. Production federates to
        your organisation's identity provider.</div></div>`;
    document.body.appendChild(el);
    const go = async ()=>{
      const email = document.getElementById('loginEmail').value.trim();
      const err = document.getElementById('loginErr');
      err.textContent='';
      if(!email){ err.textContent='Enter an email address.'; return; }
      const res = await fetch('/api/login', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email})});
      if(!res.ok){ err.textContent='Sign-in failed. Check the address.'; return; }
      el.remove();
      document.querySelector('.app').style.display='';
      await start();
    };
    document.getElementById('loginGo').onclick = go;
    document.getElementById('loginEmail').addEventListener('keydown',
      e=>{ if(e.key==='Enter') go(); });
  }
  document.getElementById('loginEmail').focus();
}

/* The view containers are created once. An error must never replace .body
   wholesale -- doing so deletes #dash, #pursuits and the rest, and the next
   successful load has nowhere to render. That turned one bad login into a
   page that stayed broken until a full browser reload. */
const BODY_TEMPLATE = document.querySelector('.body').innerHTML;

function restoreViewContainers(){
  const body = document.querySelector('.body');
  if(!document.getElementById('dash')) body.innerHTML = BODY_TEMPLATE;
}

function showLoadError(msg){
  restoreViewContainers();
  const el = document.getElementById('dash');
  const html = `<div class="card"><h3>Could not load the portfolio</h3>
     <div class="note">${msg}</div></div>`;
  if(el){ el.innerHTML = html; show('dash'); }
  else { document.querySelector('.body').innerHTML = html; }
}

async function start(){
  restoreViewContainers();
  try{
    if(await loadData()){
      render();
      show('dash');        // land on the dashboard, not wherever we were
      startChangePolling();
    }
  }catch(e){
    console.error(e);
    showLoadError(`${e.message}<br><br>If this just started happening after an update, try a hard refresh (Ctrl+Shift+R) \u2014 the browser may be showing a cached copy of the page.`);
  }
}
start();
